# libbitcask 封装的文案（UTF-8）。源自 keelson clj-bitcask i18n/strings*.edn；占位符 {0} {1} … 同 .NET string.Format。
bitcask/already-exists=已经存在
bitcask/analyzer-mismatch=分词器与建库时不一致
bitcask/bad-crc=CRC 校验失败（数据损坏）
bitcask/batch-cond-invalid=批操作的前置条件不认得：{0}（要 :absent 或 [:ord n]）
bitcask/batch-conflict=原子批的前置条件不成立（操作下标 {0}，从 0 起），整批没有写
bitcask/batch-op-invalid=批里的操作不认得：{0}
bitcask/busy=仍有库打开或其它线程占用中，暂时不能卸载
bitcask/closed=这个存储已经关了
bitcask/condition-failed=原子批的前置条件不成立
bitcask/cursor-no-entry=游标不在条目上：先调 MoveNext() 且其返回 true。
bitcask/cypher-error=Cypher 语句出错（{0}）：{1}
bitcask/dim-mismatch=向量维度是 {0}，这个存储建库时定的是 {1}
bitcask/disposed={0} 已经关闭，不能再用
bitcask/fault=未知错误（{0}）
bitcask/fault-message={0}：{1}
bitcask/fault-message-detail={0}：{1}：{2}
bitcask/fault-message-errno={0}：{1}（errno {2}）
bitcask/fault-message-errno-detail={0}：{1}（errno {2}）：{3}
bitcask/filter-in-empty=In 条件（键 {0}）至少要一个候选值
bitcask/filter-invalid=过滤条件不合规：{0}
bitcask/graph-adjacency-malformed=顶点 {0} 的邻接表头变了形
bitcask/graph-batch-duplicate-edge=同一批里边 ({0} {1} {2} rank {3}) 重复
bitcask/graph-batch-duplicate-vertex=同一批里顶点 {0} 重复
bitcask/graph-batch-empty=图批是空的：至少要有一个顶点、一条边或一条删边
bitcask/graph-batch-op-invalid=图批里的操作不认得：{0}
bitcask/graph-chunk-malformed=邻接表分块变了形：{0}
bitcask/graph-config-invalid=图参数 {0} 不合法：{1}
bitcask/graph-conflict=写边冲突重试耗尽：同一批顶点一直被并发写者先改（可调大 :retries，或改用 put-edges!）
bitcask/graph-etype-name-blank=etype {0} 的名字是空的
bitcask/graph-etype-name-empty=etype 名字要是非空字符串
bitcask/graph-etype-name-too-long=etype 名字要短于 65535 字节：{0}
bitcask/graph-etype-out-of-range=etype 要是 32 位能表示的整数（[-2^31, 2^32)）：{0}
bitcask/graph-etype-record-malformed=etype 记录变了形：{0}
bitcask/graph-inconsistent-read=顶点 {0} 的一致性读一直撞上并发写，读不到原子快照
bitcask/graph-label-invalid=标签要是非空字符串、UTF-8 短于 65535 字节：{0}
bitcask/graph-layout-unknown=图元信息键 g 的布局不认得（不是布局 1）
bitcask/graph-negative={0} 要是非负数
bitcask/graph-pagerank-damping=damping 要在 [0, 1] 里
bitcask/graph-pagerank-eps=eps 要是正数
bitcask/graph-path-broken=最短路的父链断了（内部错误）：{0}
bitcask/graph-property-key-invalid=属性名要是非空字符串（或关键字）：{0}
bitcask/graph-property-reserved=下划线开头的属性名留给实现：{0}
bitcask/graph-property-type=属性 {0} 的类型不支持（可以是 nil、布尔、整数、浮点、字符串、字符串列表）
bitcask/graph-too-many-groups=一个顶点的边组太多（{0} 组，上限 65535）
bitcask/graph-vertex-meta-malformed=顶点 {0} 的 meta 解不开，不覆盖看不懂的数据
bitcask/graph-vertex-not-found=顶点 {0} 不存在
bitcask/graph-vertex-spec-invalid=顶点要是文本，或带 :labels :props :text :vector 键的 map：{0}
bitcask/graph-vid-counter-malformed=顶点 id 高水位键的值畸形
bitcask/graph-vid-exhausted=顶点 id 已用尽（2^64）
bitcask/index-corrupt=索引定位成功，但读回记录与请求不一致
bitcask/index-rebuild-failed=索引重建失败
bitcask/invalid-option=选项不合法
bitcask/io=I/O 错误
bitcask/jieba-dict-partial=jieba 词典目录 {0} 缺文件：{1}
bitcask/jieba-no-dict=找不到 jieba 词典：<应用目录>/{0} 不齐（bitcask 平台 jar 会把它放在库旁边），也没给 BitcaskIndexOptions.JiebaDictPath。
bitcask/key-too-large=键太大
bitcask/merge-files-blank=显式 merge 的文件表里有空路径。
bitcask/merge-files-empty=显式 merge 的文件表是空的（上游把空表当「自动决定」；要自动请调 Merge()）。
bitcask/merge-policy-percent=merge 策略的 {0} 是百分比，须在 [0, 100]：{1}
bitcask/meta-duplicate-key=meta 里键 {0} 重复
bitcask/meta-truncated=meta 段解不出来：截断了，或者不是 BitcaskMeta.Encode 编出来的（裸字节请直接读 Meta）
bitcask/meta-version=meta 段的格式版本是 {0}，只认 1（不是 BitcaskMeta.Encode 编出来的？）
bitcask/meta-wrong-type=meta 值的类型是 {1}，不是 {0}
bitcask/missing-symbol=libbitcask 缺入口 {0}（原生库版本不对？）
bitcask/mode-mismatch=打开模式与库不一致
bitcask/need-text-or-vector=文本与向量至少要给一个
bitcask/no-index=这个存储没有索引
bitcask/no-library=找不到 libbitcask 原生库（{0}）：{1}
bitcask/not-found=没有这个键
bitcask/options-invalid=选项不合规：{0}
bitcask/probe-corrupt={0} 里的 bitcask.meta 坏了：{1}
bitcask/probe-not-bitcask={0} 不是 bitcask 库（没有 bitcask.meta）
bitcask/probe-not-directory={0} 不存在或不是目录
bitcask/probe-unsupported={0} 里的 bitcask.meta 这个版本认不得：{1}
bitcask/put-batch-put-only=bitcask_put_batch 只收 put；带 remove 或文档的批用 WriteAtomic / Commit。
bitcask/query-dim-mismatch=查询向量长度 {0} ≠ 库的维度 {1}。
bitcask/read-only=存储是只读的
bitcask/value-too-large=值太大
bitcask/vector-config-mismatch=向量配置与库不一致：库里 {0}，选项 {1}
bitcask/vector-dimension-range=VectorDimension 须在 [0, 65535]。
bitcask/write-locked=存储被另一个写者锁着
