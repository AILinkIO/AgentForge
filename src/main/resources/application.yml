spring:
    main:
        web-application-type: none
        banner-mode: off
    application:
        name: AgentForge
    datasource:
        url: jdbc:h2:file:./data/agentforge
        driver-class-name: org.h2.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
    ai:
        model:
            chat: ${LLM_PROVIDER:claude}
        openai:
            api-key: ${OPENAI_API_KEY:}
            base-url: https://api.openai.com
            chat:
                options:
                    model: gpt-4o
                    max-tokens: 16384
        anthropic:
            api-key: ${ANTHROPIC_AUTH_TOKEN:}
            base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
            chat:
                options:
                    model: MiniMax-M2.5
                    max-tokens: 16384

logging:
    level:
        root: warn
