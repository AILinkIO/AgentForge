# 沙盒文案（键 = 稳定错误码；{0} {1} … 是参数）。由 keelson clj-sandbox i18n 移植。
sandbox/approval-denied=审批未通过，命令没有执行
sandbox/approval-disallowed=审批策略不允许发起沙盒审批
sandbox/bwrap-cannot-mask=无法在沙盒里遮住文件 {0}
sandbox/bwrap-deny-symlink=无法保证沙盒禁读路径 {0}：它经过可写的符号链接 {1}
sandbox/bwrap-glob-too-broad=禁读 glob「{0}」无法安全展开；请用带非根目录前缀的模式
sandbox/bwrap-glob-too-many=禁读 glob「{0}」匹配超过 {1} 个路径
sandbox/bwrap-missing=找不到 bubblewrap（{0}）；请用系统的包管理器安装 bubblewrap
sandbox/bwrap-not-linux=bubblewrap 沙盒只在 Linux 上可用
sandbox/bwrap-read-only-symlink=无法保证沙盒只读路径 {0}：它经过可写的符号链接 {1}
sandbox/bwrap-untrusted={0} 处的 bubblewrap 可在沙盒内被改写，拒绝使用
sandbox/bwrap-userns-blocked=Linux 沙盒依赖 bubblewrap，需要能创建 user namespace（{0}）；Ubuntu 24.04 起 AppArmor 默认限制非特权 user namespace
sandbox/bwrap-wsl1=Linux 沙盒依赖 bubblewrap，而 WSL1 无法创建所需的 user namespace；请改用 WSL2
sandbox/denied=命令被沙盒（{0}）拒绝
sandbox/exec-bad-timeout=执行时限必须大于 0。
sandbox/hardening-failed=进程加固失败：{0}（errno {1}）
sandbox/hardening-unsupported=本平台不支持该进程加固：{0}
sandbox/invalid-policy-json=沙盒策略 JSON 无效：{0}
sandbox/landlock-directory-locked=原生件目录已经定过了，不能再改
sandbox/landlock-native-missing=找不到沙盒原生件 libagentforge_sandbox_native（`./gradlew :sandbox:buildNative` 编出后用 LandlockSandbox.setNativeDirectory 或系统属性 agentforge.sandbox.native.dir 指明目录）
sandbox/landlock-not-linux=Landlock 沙盒只支持 Linux
sandbox/landlock-unsupported=本机内核不支持 Landlock（需要 Linux 5.13 以上），沙盒降级
sandbox/network-host-approval=是否允许沙盒访问 {0}（{1}）？
sandbox/network-proxy-already-started=本地网络代理已经启动，不能重复启动
sandbox/network-proxy-bad-protocol=未知网络代理协议
sandbox/network-proxy-bad-timeout=网络代理的上游连接超时必须大于零
sandbox/network-proxy-bridge-already-started=网络代理桥已经启动，不能重复启动
sandbox/network-proxy-bridge-bad-endpoint=本地网络代理端点无效
sandbox/network-proxy-bridge-bad-listener=网络代理桥收到无效的沙盒监听描述符（errno {0}）
sandbox/network-proxy-bridge-proxy-not-started=网络代理桥启动前要先启动本地网络代理
sandbox/no-backend=没有配置沙盒后端
sandbox/path-not-absolute=沙盒路径必须是绝对路径：{0}
sandbox/protected-path={0} 位于受保护的 {1} 之下，沙盒内保持只读
sandbox/read-denied=沙盒策略禁止访问该路径：{0}
sandbox/read-outside-roots=该路径不在沙盒策略允许读取的范围内：{0}
sandbox/retry-without-sandbox=命令执行失败；要不带沙盒重试吗？
sandbox/unavailable=策略要求沙盒，但沙盒不可用：{0}
sandbox/unavailable-deny-read=策略含禁止读取的规则，必须有可用的文件系统沙盒才能执行：{0}
sandbox/win-acl-failed=可写根授权失败（{0}；Win32 错误 {1}）
sandbox/win-appcontainer-deny-path-missing=策略要屏蔽的路径不存在，无法加 deny ACE（失败即拒，不能放行）：{0}
sandbox/win-appcontainer-policy-unsupported=策略超出 AppContainer 沙盒的能力（{0}）
sandbox/win-appcontainer-process-failed=以 AppContainer 起进程失败（Win32 错误 {0}）
sandbox/win-appcontainer-profile-delete-failed=删除 AppContainer profile 失败（HRESULT {0}）
sandbox/win-appcontainer-profile-failed=创建 AppContainer profile 失败（HRESULT {0}）
sandbox/win-batch-refused=Windows 沙盒缺省拒跑 .bat / .cmd（参数转义有已知注入问题）：{0}
sandbox/win-command-line-too-long=命令行超过 CreateProcess 的上限（约 32767 字符）；把参数放 stdin 或文件里
sandbox/win-desktop-failed=创建私有桌面失败（Win32 错误 {0}）
sandbox/win-empty-arguments=argv 为空：第一个元素是程序
sandbox/win-not-windows=Windows 沙盒只能在 Windows 上用
sandbox/win-path-ads-rejected=⛔ 备用数据流（ADS）路径不能授权：{0}
sandbox/win-path-missing=要授权的路径不存在：{0}
sandbox/win-path-reparse-rejected=⛔ 路径本身或祖先是重解析点（junction / 符号链接），拒绝授权：{0}
sandbox/win-path-unc-rejected=⛔ UNC / 网络路径不能作为沙盒根：{0}
sandbox/win-policy-unsupported=策略超出 Windows 一期沙盒的能力（{0}）；需要读隔离 / 全盘可写 / 代理网络的支持要到二期 AppContainer
sandbox/win-process-failed=以受限令牌起进程失败（Win32 错误 {0}）
sandbox/win-token-failed=创建受限令牌失败（Win32 错误 {0}）
sandbox/win-tty-unsupported=Windows 沙盒不给伪终端（立法 46）
sandbox/write-denied=沙盒策略不允许写入该路径：{0}
exec/empty-arguments=执行请求没有程序：arguments 至少要有一项（第一项是程序）。
exec/tty-unsupported=执行后端 {0} 不提供伪终端：去掉 tty，或换一个支持伪终端的宿主后端。
process/batch-file-refused=拒绝直接运行批处理文件 "{0}"（cmd.exe 的参数解析无法安全转义，见 CVE-2024-27980）；确认参数可信后设 allowBatchFile = true。
sandbox/execpolicy-prompt-conflict=规则要求审批，但审批策略是 never（从不问）
sandbox/execpolicy-sandbox-disallowed=需要审批，但细粒度审批策略关掉了沙盒审批
sandbox/execpolicy-rules-disallowed=规则要求审批，但细粒度审批策略关掉了规则审批
sandbox/execpolicy-prompt-justified=`{0}` 需要审批：{1}
sandbox/execpolicy-prompt-policy=`{0}` 按规则需要审批
sandbox/execpolicy-forbidden-justified=`{0}` 被拒：{1}
sandbox/execpolicy-forbidden-prefix=`{0}` 被拒：规则禁止以 `{1}` 开头的命令
sandbox/execpolicy-forbidden-blocked=`{0}` 被拒：策略不允许
sandbox/execpolicy-forced-rm=不允许 rm -f 这类强删命令，请换个更稳妥的做法
sandbox/execpolicy-escalation-rejected=审批策略是 {0}，不能申请出沙盒（sandbox_permissions=require_escalated）；请在沙盒内完成，或请用户调整审批策略
sandbox/execpolicy-parse-error={0}:{1}: {2}
sandbox/patch-empty=空补丁
sandbox/patch-outside-project=要写的路径不在可写范围内；审批策略不允许询问，已拒绝
sandbox/patch-read-only=只读沙盒禁止写文件；审批策略不允许询问，已拒绝
