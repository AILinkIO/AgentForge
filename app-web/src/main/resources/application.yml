server:
  address: 127.0.0.1
  port: 8787
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  application:
    name: agentforge-web
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: -1

logging:
  level:
    root: WARN
    io.ailink.agentforge: INFO
    org.springframework.boot.web.server: INFO
