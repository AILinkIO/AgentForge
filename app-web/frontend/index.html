<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentForge</title>
    <script>
      // 先于 React 套上主题，免得闪一下白
      try {
        const s = JSON.parse(localStorage.getItem('agentforge-ui') || '{}')
        const dark = s.mode === 'dark' || ((!s.mode || s.mode === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        const h = document.documentElement
        if (dark) h.classList.add('dark')
        if (s.preset) h.dataset.preset = s.preset
        if (s.radius != null) h.style.setProperty('--radius', s.radius + 'rem')
        if (s.scale) h.dataset.scale = s.scale
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
